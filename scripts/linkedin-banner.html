<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1584px;
        height: 396px;
        overflow: hidden;
      }

      body {
        background: #fefefb;
        font-family: "DM Sans", -apple-system, sans-serif;
        color: #1a1a18;
      }

      .banner {
        position: relative;
        width: 1584px;
        height: 396px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 80px 48px 420px;
        border-bottom: 1px solid #e4e3de;
      }

      .banner::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: #e8392d;
      }

      .content {
        width: 100%;
        max-width: 900px;
        text-align: center;
      }

      .eyebrow {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #c42e24;
        margin-bottom: 16px;
      }

      .title {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 56px;
        font-weight: 400;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 18px;
      }

      .subtitle {
        font-size: 26px;
        font-weight: 500;
        line-height: 1.4;
        color: #5a5a55;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="content">
        <p class="eyebrow">Greater Boston · He/Him</p>
        <h1 class="title">Hello, I&rsquo;m Josh Bowden.</h1>
        <p class="subtitle">Engineering · Design Systems &amp; Accessibility</p>
      </div>
    </div>
  </body>
</html>
